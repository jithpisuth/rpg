<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Villager's Journey - RPG</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Kanit:wght@300;400&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ffd700;
            --warrior: #ff4d4d;
            --tank: #4d94ff;
            --mage: #b366ff;
            --ranger: #4dff88;
            --bg-dark: #0f0f15;
            --panel-bg: rgba(20, 20, 30, 0.9);
        }

        body {
            margin: 0; background: var(--bg-dark); color: #e0e0e0;
            font-family: 'Kanit', sans-serif; height: 100vh; display: flex;
            justify-content: center; align-items: center; overflow: hidden;
        }

        #game-window {
            width: 95vw; height: 90vh; display: grid;
            grid-template-columns: 320px 1fr 320px; gap: 20px;
            padding: 20px; border: 2px solid #333; border-radius: 15px;
            background: linear-gradient(135deg, #1a1a2e 0%, #0f0f15 100%);
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
        }

        .panel {
            background: var(--panel-bg); border: 1px solid #444;
            border-radius: 12px; padding: 20px; overflow-y: auto;
            display: flex; flex-direction: column;
        }

        h2 { font-family: 'Cinzel', serif; color: var(--primary); margin-top: 0; border-bottom: 1px solid #444; }

        /* Combat Area */
        #combat-section { display: flex; flex-direction: column; align-items: center; justify-content: space-between; position: relative; }
        #stage-info { font-family: 'Cinzel', serif; font-size: 1.5rem; text-align: center; margin-bottom: 20px; }
        
        #monster-container {
            flex-grow: 1; display: flex; flex-direction: column;
            justify-content: center; align-items: center; width: 100%;
        }
        #monster-visual { font-size: 120px; filter: drop-shadow(0 0 20px rgba(255,255,255,0.2)); transition: 0.1s; }
        .damage-pop { position: absolute; color: red; font-weight: bold; animation: floatUp 0.5s forwards; }

        /* Bars */
        .bar { width: 100%; height: 12px; background: #222; border-radius: 6px; margin: 10px 0; overflow: hidden; border: 1px solid #444; }
        .fill { height: 100%; width: 0%; transition: width 0.2s ease-in-out; }
        #hp-fill { background: linear-gradient(90deg, #ff4d4d, #990000); }
        #exp-fill { background: linear-gradient(90deg, #ffd700, #ff8c00); }

        /* Class Selection Overlay */
        #class-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); display: none; justify-content: center;
            align-items: center; z-index: 100;
        }
        .modal-content {
            background: #222; padding: 30px; border-radius: 20px;
            text-align: center; border: 2px solid var(--primary);
        }
        .class-card {
            display: inline-block; width: 150px; padding: 15px; margin: 10px;
            border: 1px solid #444; border-radius: 10px; cursor: pointer; transition: 0.3s;
        }
        .class-card:hover { border-color: var(--primary); transform: translateY(-5px); background: #333; }

        /* Inventory & Log */
        #inventory-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
        .slot { aspect-ratio: 1; background: #111; border: 1px solid #333; border-radius: 4px; display: flex; justify-content: center; align-items: center; font-size: 1.2rem; }
        #log { font-size: 0.85rem; height: 120px; overflow-y: auto; background: rgba(0,0,0,0.3); padding: 10px; border-radius: 5px; margin-top: 10px; }

        @keyframes floatUp { from { transform: translateY(0); opacity: 1; } to { transform: translateY(-50px); opacity: 0; } }

        button {
            background: #333; color: white; border: 1px solid #555; padding: 10px;
            border-radius: 5px; cursor: pointer; font-family: 'Kanit';
        }
        button:hover { background: #444; border-color: var(--primary); }
    </style>
</head>
<body>

<div id="game-window">
    <div class="panel">
        <h2 id="player-job">ชาวบ้าน (Villager)</h2>
        <div style="text-align: center;">
            <span id="player-emoji" style="font-size: 60px;">👨‍🌾</span>
        </div>
        <p>Base Level: <span id="lv-text" style="color:var(--primary)">1</span></p>
        <div class="bar"><div id="exp-fill" class="fill"></div></div>
        
        <div style="margin-top: 10px;">
            <div>อาวุธ: <span id="weapon-text" style="color:#aaa">จอบไม้ (Wooden Hoe)</span></div>
            <div>พลังโจมตี: <span id="atk-text">5</span></div>
            <div>ความเร็ว: <span id="spd-text">1.0</span>/วินาที</div>
        </div>

        <h3 style="border-top: 1px solid #333; padding-top: 15px;">Stage Progress</h3>
        <p id="stage-name" style="color: #4dff88;">🏡 หมู่บ้านเริ่มต้น</p>
        
        <div style="margin-top: auto;">
            <p>Zeny: <span id="zeny-text" style="color:gold">0</span></p>
        </div>
    </div>

    <div id="combat-section" class="panel">
        <div id="stage-info">STAGE 1-1</div>
        <div id="monster-container">
            <h3 id="monster-name">หนูนา</h3>
            <div id="monster-visual">🐀</div>
            <div class="bar" style="width: 60%;"><div id="hp-fill" class="fill"></div></div>
            <div id="hp-text">10 / 10</div>
        </div>
        <div id="log"></div>
    </div>

    <div class="panel">
        <h2>กระเป๋าเป้</h2>
        <div id="inventory-grid"></div>
        
        <h2 style="margin-top: 20px;">สกิลอาชีพ</h2>
        <div id="skill-list">
            <p style="font-size: 0.8rem; color: #777;">ยังไม่มีอาชีพเฉพาะทาง...</p>
        </div>
    </div>
</div>

<div id="class-modal">
    <div class="modal-content">
        <h1 id="modal-title">เลือกเส้นทางเดินของคุณ</h1>
        <div id="class-options"></div>
    </div>
</div>

<script>

/* =====================================================
   AAA RPG V8 – STABLE BUILD
===================================================== */

const SAVE_KEY="AAA_RPG_V8";

let autoLoop=null;
let tickLoop=null;

/* ================= ELEMENT ================= */

const Elements={
list:["Fire","Water","Earth","Wind"],
table:{
Fire:{strong:"Earth",weak:"Water"},
Water:{strong:"Fire",weak:"Wind"},
Earth:{strong:"Wind",weak:"Fire"},
Wind:{strong:"Water",weak:"Earth"}
},
multiplier(a,d){
if(!a) return 1;
if(this.table[a].strong===d) return 1.5;
if(this.table[a].weak===d) return 0.7;
return 1;
}
};

/* ================= JOB ================= */

const Jobs={
warrior:{name:"⚔ Warrior",bonus:{atk:5,matk:0},skills:["powerStrike"]},
tank:{name:"🛡 Tank",bonus:{atk:3,matk:0},skills:["shieldBurn"]},
mage:{name:"🧙 Mage",bonus:{atk:0,matk:6},skills:["fireball"]},
ranger:{name:"🏹 Ranger",bonus:{atk:4,matk:2},skills:["frostShot"]}
};

/* ================= SKILLS ================= */

const SkillDB={
powerStrike:{name:"Power Strike",type:"physical",power:2,cooldown:4000},
fireball:{name:"🔥 Fireball",type:"magical",power:2.5,element:"Fire",cooldown:5000,effect:"burn"},
frostShot:{name:"❄ Frost Shot",type:"physical",power:2,element:"Water",cooldown:4500,effect:"freeze"},
shieldBurn:{name:"Flame Shield",type:"physical",power:1.5,element:"Fire",cooldown:5000,effect:"burn"}
};

/* ================= GAME ================= */

const Game={
state:null,
runtime:{
burnTimer:0,
freezeTimer:0
},

default(){
return{
lv:1,
exp:0,
expNext:20,
zeny:0,

job:null,

baseAtk:5,
baseMatk:3,

critRate:0.05,
critDmg:1.5,
aspd:1000,

stage:1,
monster:null,
monsterHp:0,

skills:[],
inventory:[]
}
},

init(){
this.load();
Stage.spawn();
Combat.start();
UI.bind();
UI.renderSkills();
UI.updateAll();
},

save(){localStorage.setItem(SAVE_KEY,JSON.stringify(this.state));},
load(){
const s=localStorage.getItem(SAVE_KEY);
this.state=s?JSON.parse(s):this.default();
}
};

/* ================= STAGE ================= */

const Stage={
spawn(){
const s=Game.state.stage;

Game.state.monster={
name:"Wild Beast",
emoji:"🐺",
hp:40*s,
exp:10*s,
zeny:5*s,
element:Elements.list[Math.floor(Math.random()*4)]
};

Game.state.monsterHp=Game.state.monster.hp;
Game.runtime.burnTimer=0;
Game.runtime.freezeTimer=0;

UI.updateMonster();
}
};

/* ================= COMBAT ================= */

const Combat={

start(){
if(autoLoop)clearInterval(autoLoop);
autoLoop=setInterval(()=>this.autoAttack(),Game.state.aspd);
},

autoAttack(){
if(Game.runtime.freezeTimer>0) return;
this.damage(Game.state.baseAtk);
},

useSkill(id){
const skill=Game.state.skills.find(s=>s.id===id);
if(!skill||skill.cd>0) return;

skill.cd=skill.cooldown;

let base=skill.type==="physical"
?Game.state.baseAtk
:Game.state.baseMatk;

let dmg=base*skill.power;

if(skill.element){
dmg*=Elements.multiplier(
skill.element,
Game.state.monster.element);
}

this.damage(dmg);

if(skill.effect==="burn")
Game.runtime.burnTimer=3000;

if(skill.effect==="freeze")
Game.runtime.freezeTimer=2000;
},

damage(amount){

if(Game.state.monsterHp<=0) return;

let dmg=amount;

if(Math.random()<Game.state.critRate)
dmg*=Game.state.critDmg;

dmg=Math.floor(dmg);
Game.state.monsterHp-=dmg;

UI.damage(dmg);

if(Game.state.monsterHp<=0)
this.victory();
},

victory(){

const m=Game.state.monster;

Game.state.exp+=m.exp;
Game.state.zeny+=m.zeny;

UI.log(`+${m.exp} EXP | +${m.zeny} Zeny`);

while(Game.state.exp>=Game.state.expNext)
Level.up();

Game.state.stage++;
Stage.spawn();
UI.updateAll();
Game.save();
}
};

/* ================= LEVEL ================= */

const Level={
up(){
Game.state.exp-=Game.state.expNext;
Game.state.lv++;
Game.state.expNext=Math.floor(Game.state.expNext*1.3);
Game.state.baseAtk+=2;
Game.state.baseMatk+=2;

UI.log("⭐ LEVEL UP!");

if(Game.state.lv===10&&!Game.state.job)
UI.showJobSelect();
}
};

/* ================= UI ================= */

const UI={

bind(){
document.getElementById("monster-visual")
.addEventListener("click",
()=>Combat.autoAttack());
},

updateAll(){
document.getElementById("lv-text").innerText=Game.state.lv;
document.getElementById("atk-text").innerText=Game.state.baseAtk;
document.getElementById("zeny-text").innerText=Game.state.zeny;

const percent=
(Game.state.exp/Game.state.expNext)*100;

document.getElementById("exp-fill").style.width=
percent+"%";

document.getElementById("player-job").innerText=
Game.state.job
?Jobs[Game.state.job].name
:"ชาวบ้าน (Villager)";
},

updateMonster(){
const hpPercent=
(Game.state.monsterHp/
Game.state.monster.hp)*100;

document.getElementById("hp-fill").style.width=
hpPercent+"%";

document.getElementById("hp-text").innerText=
Math.max(0,Game.state.monsterHp)+
" / "+Game.state.monster.hp;

document.getElementById("monster-name").innerText=
Game.state.monster.name+
" ["+Game.state.monster.element+"]";
},

damage(d){
const pop=document.createElement("div");
pop.className="damage-pop";
pop.innerText="-"+d;
document.getElementById("monster-container")
.appendChild(pop);
setTimeout(()=>pop.remove(),600);
},

renderSkills(){
const list=document.getElementById("skill-list");
list.innerHTML="";
Game.state.skills.forEach(skill=>{
skill.cd=skill.cd||0;
const btn=document.createElement("button");
btn.id="skill_"+skill.id;
btn.onclick=()=>Combat.useSkill(skill.id);
list.appendChild(btn);
});
},

updateCooldowns(dt){
Game.state.skills.forEach(skill=>{
if(skill.cd>0){
skill.cd-=dt;
if(skill.cd<0)skill.cd=0;
const btn=document.getElementById("skill_"+skill.id);
if(btn){
btn.innerText=
skill.name+
(skill.cd>0?
` (${(skill.cd/1000).toFixed(1)})`:"");
btn.disabled=skill.cd>0;
}
}
});
},

log(text){
const log=document.getElementById("log");
log.innerHTML+=text+"<br>";
log.scrollTop=log.scrollHeight;
},

showJobSelect(){
const modal=document.getElementById("class-modal");
const options=document.getElementById("class-options");
modal.style.display="flex";
options.innerHTML="";

for(let key in Jobs){
const card=document.createElement("div");
card.className="class-card";
card.innerText=Jobs[key].name;
card.onclick=()=>{
Game.state.job=key;
Game.state.baseAtk+=Jobs[key].bonus.atk;
Game.state.baseMatk+=Jobs[key].bonus.matk;

Game.state.skills=
Jobs[key].skills.map(id=>({
id:id,
...SkillDB[id],
cd:0
}));

modal.style.display="none";
UI.renderSkills();
UI.updateAll();
};
options.appendChild(card);
}
}
};

/* ================= TICK LOOP ================= */

let last=Date.now();

tickLoop=setInterval(()=>{
const now=Date.now();
const dt=now-last;
last=now;

UI.updateCooldowns(dt);

/* Burn */
if(Game.runtime.burnTimer>0){
Game.runtime.burnTimer-=dt;
if(Game.runtime.burnTimer%1000<dt){
Game.state.monsterHp-=5;
UI.damage(5);
}
}

/* Freeze */
if(Game.runtime.freezeTimer>0)
Game.runtime.freezeTimer-=dt;

UI.updateMonster();

},100);

Game.init();

</script>

</body>
</html>
